<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1600" height="880" fill="#F0EEE6"/>
  <line x1="800" y1="60" x2="800" y2="820" stroke="#D8D4C8" stroke-width="2" stroke-dasharray="2 10"/>

  <!-- ============ LEFT : chatbot ============ -->
  <text x="400" y="84" text-anchor="middle" font-size="30" font-weight="700" fill="#1F1E1D">A chatbot</text>
  <text x="400" y="118" text-anchor="middle" font-size="19" fill="#8A8880">answers, then stops</text>

  <rect x="190" y="164" width="420" height="70" rx="10" fill="#FFFFFF" stroke="#D8D4C8" stroke-width="1.5"/>
  <text x="400" y="206" text-anchor="middle" font-size="22" fill="#3D3D3A">You ask a question</text>
  <line x1="400" y1="234" x2="400" y2="264" stroke="#8A8880" stroke-width="2"/>
  <polygon points="400,276 392,262 408,262" fill="#8A8880"/>

  <rect x="190" y="278" width="420" height="86" rx="10" fill="#FFFFFF" stroke="#D8D4C8" stroke-width="1.5"/>
  <text x="400" y="312" text-anchor="middle" font-size="22" fill="#3D3D3A">It replies with a block of code</text>
  <rect x="238" y="328" width="180" height="7" rx="3.5" fill="#DCD8CC"/>
  <rect x="238" y="342" width="256" height="7" rx="3.5" fill="#DCD8CC"/>
  <line x1="400" y1="364" x2="400" y2="396" stroke="#8A8880" stroke-width="2" stroke-dasharray="6 6"/>
  <polygon points="400,408 392,394 408,394" fill="#8A8880"/>

  <rect x="190" y="410" width="420" height="238" rx="10" fill="#E8E4D8" stroke="#C9C4B4" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="400" y="452" text-anchor="middle" font-size="22" font-weight="600" fill="#1F1E1D">Then it is on you:</text>
  <text x="238" y="500" font-size="20" fill="#5C5A54">install the libraries</text>
  <text x="238" y="538" font-size="20" fill="#5C5A54">run it</text>
  <text x="238" y="576" font-size="20" fill="#5C5A54">decode the error message</text>
  <text x="238" y="614" font-size="20" fill="#5C5A54">judge whether it is correct</text>
  <circle cx="222" cy="493" r="4" fill="#8A8880"/>
  <circle cx="222" cy="531" r="4" fill="#8A8880"/>
  <circle cx="222" cy="569" r="4" fill="#8A8880"/>
  <circle cx="222" cy="607" r="4" fill="#8A8880"/>

  <text x="400" y="706" text-anchor="middle" font-size="20" font-style="italic" fill="#8A8880">The technical layer is still your problem.</text>

  <!-- ============ RIGHT : agent ============ -->
  <text x="1160" y="84" text-anchor="middle" font-size="30" font-weight="700" fill="#1F1E1D">Claude Code, an agent</text>
  <text x="1160" y="118" text-anchor="middle" font-size="19" fill="#8A8880">acts, checks itself, and shows you</text>

  <rect x="890" y="164" width="540" height="70" rx="10" fill="#FFFFFF" stroke="#D8D4C8" stroke-width="1.5"/>
  <text x="1160" y="206" text-anchor="middle" font-size="22" fill="#3D3D3A">You describe the scientific goal</text>
  <line x1="1160" y1="234" x2="1160" y2="252" stroke="#8A8880" stroke-width="2"/>
  <polygon points="1160,264 1152,250 1168,250" fill="#8A8880"/>

  <rect x="890" y="266" width="540" height="62" rx="10" fill="#FFFFFF" stroke="#D8D4C8" stroke-width="1.5"/>
  <text x="1160" y="304" text-anchor="middle" font-size="21" fill="#3D3D3A">Reads your actual files</text>
  <line x1="1160" y1="328" x2="1160" y2="342" stroke="#8A8880" stroke-width="2"/>
  <polygon points="1160,354 1152,340 1168,340" fill="#8A8880"/>

  <rect x="890" y="356" width="540" height="62" rx="10" fill="#FFFFFF" stroke="#D8D4C8" stroke-width="1.5"/>
  <text x="1160" y="394" text-anchor="middle" font-size="21" fill="#3D3D3A">Writes the code</text>
  <line x1="1160" y1="418" x2="1160" y2="432" stroke="#8A8880" stroke-width="2"/>
  <polygon points="1160,444 1152,430 1168,430" fill="#8A8880"/>

  <rect x="890" y="446" width="540" height="62" rx="10" fill="#FFFFFF" stroke="#D8D4C8" stroke-width="1.5"/>
  <text x="1160" y="484" text-anchor="middle" font-size="21" fill="#3D3D3A">Runs it</text>
  <line x1="1160" y1="508" x2="1160" y2="522" stroke="#8A8880" stroke-width="2"/>
  <polygon points="1160,534 1152,520 1168,520" fill="#8A8880"/>

  <rect x="890" y="536" width="540" height="62" rx="10" fill="#FFFFFF" stroke="#D8D4C8" stroke-width="1.5"/>
  <text x="1160" y="574" text-anchor="middle" font-size="21" fill="#3D3D3A">Looks at what came out</text>

  <!-- feedback loop arrow -->
  <path d="M1430 567 L1492 567 L1492 387 L1442 387" fill="none" stroke="#D97757" stroke-width="2.5"/>
  <polygon points="1430,387 1444,379 1444,395" fill="#D97757"/>
  <text x="1512" y="470" font-size="18" font-weight="600" fill="#D97757" transform="rotate(90 1512 470)" text-anchor="middle">fixes its own mistakes</text>

  <line x1="1160" y1="598" x2="1160" y2="618" stroke="#8A8880" stroke-width="2"/>
  <polygon points="1160,630 1152,616 1168,616" fill="#8A8880"/>
  <rect x="890" y="632" width="540" height="76" rx="10" fill="#D97757"/>
  <text x="1160" y="666" text-anchor="middle" font-size="22" font-weight="600" fill="#FFFFFF">You review the diff and approve</text>
  <text x="1160" y="692" text-anchor="middle" font-size="18" fill="#FBEAE3">this part never gets delegated</text>

  <text x="1160" y="756" text-anchor="middle" font-size="20" font-style="italic" fill="#8A8880">You supply the science. It supplies the software.</text>

  <text x="800" y="838" text-anchor="middle" font-size="17" fill="#A8A59C">Claude Code for Scientists and Academics — Figure 1</text>
</svg>
