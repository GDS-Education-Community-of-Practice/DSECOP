<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 660" width="1600" height="660"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1600" height="660" fill="#F0EEE6"/>
  <text x="800" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#1F1E1D">Four things you set before your first message</text>

  <!-- prompt box -->
  <rect x="250" y="92" width="1100" height="112" rx="14" fill="#FFFFFF" stroke="#D8D4C8" stroke-width="1.5"/>
  <text x="284" y="140" font-size="19" fill="#B4B1A8">Read data.csv and tell me what is in it: how many rows, what each</text>
  <text x="284" y="172" font-size="19" fill="#B4B1A8">column means, and which columns have missing values.</text>
  <circle cx="1296" cy="148" r="26" fill="#D97757"/>
  <polygon points="1288,158 1288,138 1306,148" fill="#FFFFFF"/>

  <!-- control pills -->
  <rect x="250" y="252" width="240" height="60" rx="30" fill="#FFFFFF" stroke="#D8D4C8" stroke-width="1.5"/>
  <circle cx="286" cy="282" r="7" fill="#2D7D6F"/>
  <text x="370" y="290" text-anchor="middle" font-size="20" fill="#3D3D3A">Local</text>

  <rect x="536" y="252" width="240" height="60" rx="30" fill="#FFFFFF" stroke="#D8D4C8" stroke-width="1.5"/>
  <path d="M568 274 h12 l4 5 h14 v16 h-30 z" fill="#C9C4B4"/>
  <text x="660" y="290" text-anchor="middle" font-size="20" fill="#3D3D3A">chapter3</text>

  <rect x="822" y="252" width="240" height="60" rx="30" fill="#FFFFFF" stroke="#D8D4C8" stroke-width="1.5"/>
  <text x="936" y="290" text-anchor="middle" font-size="20" fill="#3D3D3A">Model</text>
  <polygon points="1018,278 1032,278 1025,288" fill="#9A978E"/>

  <rect x="1108" y="252" width="240" height="60" rx="30" fill="#FBEAE3" stroke="#D97757" stroke-width="2"/>
  <text x="1228" y="290" text-anchor="middle" font-size="20" font-weight="600" fill="#B4553A">Plan</text>

  <!-- numbered badges -->
  <circle cx="370" cy="230" r="19" fill="#D97757"/><text x="370" y="237" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">1</text>
  <circle cx="656" cy="230" r="19" fill="#D97757"/><text x="656" y="237" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">2</text>
  <circle cx="942" cy="230" r="19" fill="#D97757"/><text x="942" y="237" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">3</text>
  <circle cx="1228" cy="230" r="19" fill="#D97757"/><text x="1228" y="237" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">4</text>

  <!-- tick lines -->
  <line x1="370" y1="312" x2="370" y2="356" stroke="#C9C4B4" stroke-width="2"/>
  <line x1="656" y1="312" x2="656" y2="356" stroke="#C9C4B4" stroke-width="2"/>
  <line x1="942" y1="312" x2="942" y2="356" stroke="#C9C4B4" stroke-width="2"/>
  <line x1="1228" y1="312" x2="1228" y2="356" stroke="#C9C4B4" stroke-width="2"/>

  <!-- labels -->
  <text x="370" y="392" text-anchor="middle" font-size="21" font-weight="700" fill="#1F1E1D">Environment</text>
  <text x="370" y="424" text-anchor="middle" font-size="18" fill="#5C5A54">Where Claude runs.</text>
  <text x="370" y="450" text-anchor="middle" font-size="18" fill="#5C5A54">Start with Local.</text>

  <text x="656" y="392" text-anchor="middle" font-size="21" font-weight="700" fill="#1F1E1D">Project folder</text>
  <text x="656" y="424" text-anchor="middle" font-size="18" fill="#5C5A54">What Claude can see.</text>
  <text x="656" y="450" text-anchor="middle" font-size="18" fill="#5C5A54">Pick it tight.</text>

  <text x="942" y="392" text-anchor="middle" font-size="21" font-weight="700" fill="#1F1E1D">Model</text>
  <text x="942" y="424" text-anchor="middle" font-size="18" fill="#5C5A54">The default is fine.</text>
  <text x="942" y="450" text-anchor="middle" font-size="18" fill="#5C5A54">Changeable mid-session.</text>

  <text x="1228" y="392" text-anchor="middle" font-size="21" font-weight="700" fill="#B4553A">Permission mode</text>
  <text x="1228" y="424" text-anchor="middle" font-size="18" fill="#5C5A54">How much it does alone.</text>
  <text x="1228" y="450" text-anchor="middle" font-size="18" fill="#5C5A54">Start with Plan.</text>

  <rect x="250" y="500" width="1100" height="76" rx="12" fill="#E8E4D8" stroke="#C9C4B4" stroke-width="1.5"/>
  <text x="800" y="533" text-anchor="middle" font-size="19" font-weight="600" fill="#3D3D3A">The project folder is a privacy control, not just an organisational one.</text>
  <text x="800" y="561" text-anchor="middle" font-size="18" fill="#5C5A54">Claude cannot see anything outside the folder you select.</text>

  <text x="800" y="628" text-anchor="middle" font-size="17" fill="#A8A59C">Claude Code for Scientists and Academics — Figure 3</text>
</svg>
